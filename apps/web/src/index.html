<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Investment Portfolio</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <!--
      display=block, а не swap: иконки Material — лигатуры, и до загрузки шрифта
      браузер рисует их ИСХОДНЫЙ ТЕКСТ («menu», «delete», «refresh») прямо в кнопках.
      block прячет их на время загрузки — пустое место лучше, чем мусорные слова.
    -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons&display=block"
      rel="stylesheet"
    />
  </head>
  <body class="mat-typography">
    <!--
      Тема выставляется ДО первой отрисовки: ThemeService стартует только вместе с
      Angular, и без этого холодная загрузка в тёмной теме успевает мигнуть белым.
      Ключ и значения синхронны с libs/web-shared/theme/theme.service.ts.
    -->
    <script>
      try {
        var m = localStorage.getItem('app-theme');
        document.documentElement.style.colorScheme =
          m === 'light' || m === 'dark' ? m : 'light dark';
      } catch (e) {
        /* localStorage недоступен — остаётся значение из styles.scss */
      }
    </script>
    <app-root></app-root>
  </body>
</html>
